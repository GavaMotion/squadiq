name: Deploy site to Cloudflare Pages

# squadiq.online is a Direct Upload Pages project, which Cloudflare cannot
# convert to a Git-connected one. This publishes to that same project with
# wrangler instead, so pushes to main go live without touching the custom
# domain or taking the site down.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:      # lets you redeploy by hand from the Actions tab

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish site/
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # --branch=main is what makes this the production deployment that
          # squadiq.online serves. Any other value would publish to a preview
          # URL instead and the live site would silently stay unchanged.
          command: >-
            pages deploy site
            --project-name=squadiq
            --branch=main
            --commit-dirty=true

      # Liveness only. wrangler's own exit code is what proves the upload
      # succeeded; this just catches the case where the deploy reported
      # success but the custom domain is serving an error.
      - name: Smoke-check squadiq.online
        run: |
          sleep 15
          code=$(curl -sS -o /tmp/live.html -w '%{http_code}' \
                   --retry 3 --retry-delay 5 "https://squadiq.online/?cb=$GITHUB_SHA")
          echo "HTTP $code"
          grep -o '<title>[^<]*' /tmp/live.html || true
          [ "$code" = "200" ] || exit 1
